<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CreditPulse</title>
<meta name="application-name" content="CreditPulse">
<meta name="theme-color" content="#E50914">
<meta name="msapplication-TileColor" content="#E50914">
<meta name="msapplication-config" content="/browserconfig.xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="mask-icon" href="/safari-pinned-tab.svg" color="#E50914">
<link rel="manifest" href="/site.webmanifest">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<!-- Vercel Web Analytics (plain-HTML variant; the React package is for Next.js apps) -->
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #f7f6f2;
    --surface:  #ffffff;
    --border:   #e5e4de;
    --text:     #0b0b0b;
    --muted:    #898781;
    --accent:   #1a56db;
    --danger:   #c81e1e;
    --warn:     #9e5a03;
    --ok:       #085041;
    --tag-bg:   #eef2ff;
    --tag-text: #3730a3;
  }

  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
         background: var(--bg); color: var(--text); min-height: 100vh; }

  /* ── HEADER ── */
  .site-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 32px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .logo { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
  .logo span { color: var(--accent); }
  .header-sub { font-size: 12px; color: var(--muted); margin-left: 4px; }
  .top-nav {
    margin-left: auto;
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .nav-link {
    border: 1px solid transparent;
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    padding: 7px 10px;
    border-radius: 7px;
    cursor: pointer;
    text-decoration: none;
  }
  .nav-link:hover { color: var(--text); background: var(--bg); }
  .nav-link.active { color: var(--accent); border-color: #c8d5f6; background: #eef4ff; }

  /* ── SEARCH ── */
  .search-wrap {
    max-width: 680px;
    margin: 48px auto 0;
    padding: 0 24px;
    text-align: center;
  }
  .search-headline { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
  .search-sub { font-size: 14px; color: var(--muted); margin-bottom: 28px; }
  .search-row { display: flex; gap: 8px; }
  .search-input {
    flex: 1;
    padding: 12px 16px;
    font-size: 16px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    outline: none;
    text-transform: uppercase;
    background: var(--surface);
    transition: border-color .15s;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-btn {
    padding: 12px 24px;
    font-size: 15px;
    font-weight: 600;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: opacity .15s;
  }
  .search-btn:hover { opacity: .88; }
  .search-btn:disabled { opacity: .5; cursor: not-allowed; }
  .examples { margin-top: 12px; font-size: 12px; color: var(--muted); }
  .examples a { color: var(--accent); cursor: pointer; text-decoration: none; }
  .examples a:hover { text-decoration: underline; }

  /* ── STATES ── */
  .state { max-width: 680px; margin: 64px auto; padding: 0 24px; text-align: center; }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .state-msg { font-size: 14px; color: var(--muted); }
  .error-box {
    background: #fff5f5;
    border: 1px solid #fca5a5;
    border-radius: 8px;
    padding: 16px 20px;
    color: var(--danger);
    font-size: 14px;
  }

  /* ── RESULTS ── */
  #results { max-width: 1100px; margin: 40px auto 80px; padding: 0 24px; display: none; }

  .fund-header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 4px;
  }
  .fund-name { font-size: 22px; font-weight: 700; }
  .fund-tag {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .06em;
    background: var(--tag-bg);
    color: var(--tag-text);
    padding: 3px 8px;
    border-radius: 999px;
  }
  .fund-meta { font-size: 13px; color: var(--muted); margin-bottom: 24px; }
  .fund-meta a { color: var(--accent); }

  /* ── STAT CARDS ── */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 20px;
  }
  .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
  .stat-value { font-size: 26px; font-weight: 700; }
  .stat-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .stat-value.danger { color: var(--danger); }
  .stat-value.warn   { color: var(--warn); }
  .score-section { border-color: #d8dee8; }
  .score-layout { display: grid; grid-template-columns: 280px 1fr; gap: 18px; align-items: stretch; }
  .score-hero {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
    background: var(--bg);
  }
  .score-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .score-number { font-size: 56px; line-height: 1; font-weight: 800; margin: 8px 0 4px; }
  .score-category { font-size: 18px; font-weight: 700; }
  .score-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; font-size: 11px; color: var(--muted); }
  .score-pill { border: 1px solid var(--border); border-radius: 999px; padding: 3px 8px; background: var(--surface); }
  .score-exceptional, .score-strong { color: var(--ok); }
  .score-stable { color: var(--accent); }
  .score-watch { color: var(--warn); }
  .score-weak, .score-distressed { color: var(--danger); }
  .score-summary { font-size: 13px; line-height: 1.5; margin-bottom: 12px; }
  .score-drivers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  .driver-box { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; background: var(--surface); }
  .driver-title { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
  .driver-box ul { margin-left: 16px; font-size: 12px; line-height: 1.45; }
  .score-method details { margin-top: 12px; font-size: 12px; color: var(--muted); }
  .score-method summary { cursor: pointer; color: var(--accent); font-weight: 600; }
  .component-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; }
  .component-table th, .component-table td { border-bottom: 1px solid var(--border); padding: 5px 6px; text-align: right; }
  .component-table th:first-child, .component-table td:first-child { text-align: left; }

  /* ── SECTION BLOCKS ── */
  .section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 24px;
    margin-bottom: 20px;
  }
  .section-title {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
    margin-bottom: 16px;
  }

  /* ── BUCKET CHARTS ── */
  .bucket-toggle-row { display: flex; justify-content: flex-end; margin-bottom: 8px; }
  .mode-toggle { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .mode-btn {
    padding: 4px 12px;
    font-size: 11px;
    font-weight: 600;
    background: var(--surface);
    color: var(--muted);
    border: none;
    cursor: pointer;
    transition: all .15s;
  }
  .mode-btn + .mode-btn { border-left: 1px solid var(--border); }
  .mode-btn.active { background: var(--accent); color: #fff; }
  .charts-grid { display: grid; grid-template-columns: 1.7fr 1fr; gap: 20px; margin-bottom: 20px; }
  .chart-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 24px;
  }
  .bucket-chart-wrap { height: 360px; }
  .chart-title { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 16px; }
  .position-scatter-head { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; margin-bottom: 10px; }
  .position-scatter-meta { font-size: 12px; color: var(--muted); }
  .position-legend { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 10px; font-size: 11px; color: var(--muted); }
  .legend-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
  .position-chart-wrap { height: 210px; }
  .position-note { font-size: 12px; line-height: 1.45; color: var(--muted); margin-top: 12px; }
  .realized-loss-chart-wrap,
  .cum-realized-chart-wrap { height: 300px; }

  /* ── ROLL-RATE ── */
  .period-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .period-tab {
    padding: 5px 12px;
    font-size: 12px;
    font-weight: 500;
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    background: var(--bg);
    transition: all .15s;
  }
  .period-tab.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  .matrix-wrap { overflow-x: auto; }
  table.matrix {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    table-layout: fixed;
  }
  table.matrix th, table.matrix td {
    padding: 6px 8px;
    text-align: right;
    border: 1px solid var(--border);
    white-space: nowrap;
  }
  table.matrix th { background: var(--bg); font-weight: 600; text-align: center; }
  table.matrix td.row-label { text-align: left; font-weight: 600; background: var(--bg); }
  table.matrix td.diagonal { background: #dbeafe; }
  table.matrix td.worsen   { background: #fee2e2; }
  table.matrix td.improve  { background: #dcfce7; }
  table.matrix td.exit-col { background: #fef9c3; }
  table.matrix td.entry-row { background: #f3e8ff; }
  table.matrix td.zero     { color: #ccc; }

  .rate-bar-row { display: flex; gap: 20px; margin-top: 16px; flex-wrap: wrap; }
  .rate-item { flex: 1; min-width: 120px; }
  .rate-label { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .rate-val { font-size: 20px; font-weight: 700; }
  .rate-val.danger { color: var(--danger); }
  .rate-val.ok     { color: var(--ok); }
  .rate-val.muted  { color: var(--muted); }

  .realized-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 18px; align-items: start; }
  .gains-tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
  .gains-tiles .stat-card { background: var(--bg); }
  .gains-tiles .stat-value { font-size: 22px; }
  .stat-value.ok { color: var(--ok); }
  .realized-insight { font-size: 13px; line-height: 1.45; color: var(--text); margin-bottom: 12px; }
  .source-note { font-size: 11px; line-height: 1.4; color: var(--muted); margin-top: 12px; }
  table.realized {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  table.realized th {
    padding: 6px 8px;
    text-align: right;
    color: var(--muted);
    font-weight: 600;
    border-bottom: 1px solid var(--border);
  }
  table.realized th:first-child { text-align: left; }
  table.realized td {
    padding: 6px 8px;
    text-align: right;
    border-bottom: 1px solid var(--border);
  }
  table.realized td:first-child { text-align: left; font-weight: 500; }
  table.realized tr:last-child td { border-bottom: none; }

  /* ── STRESS TABLE ── */
  table.stress {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  table.stress th {
    padding: 6px 10px;
    text-align: right;
    border-bottom: 2px solid var(--border);
    font-size: 11px;
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  table.stress th:first-child { text-align: left; }
  table.stress td {
    padding: 6px 10px;
    border-bottom: 1px solid var(--border);
    text-align: right;
    vertical-align: middle;
  }
  table.stress td:first-child { text-align: left; font-weight: 500; }
  table.stress tr:last-child td { border-bottom: none; }
  table.stress tr:hover td { background: var(--bg); }

  .section-badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 4px;
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  .section-badge.migrated { background: #fef3c7; color: #92400e; }
  .section-badge.stressed  { background: #fee2e2; color: #991b1b; }
  .section-badge.new       { background: #f3e8ff; color: #6b21a8; }
  .section-row td { padding-top: 12px; }

  .mark-chip {
    display: inline-block;
    padding: 2px 7px;
    border-radius: 5px;
    font-weight: 700;
    font-size: 11px;
  }
  .cached-badge {
    font-size: 11px;
    color: var(--muted);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px 8px;
    margin-left: 8px;
  }

  /* ── BDC VALUE MAP ── */
  #valueMapPage { max-width: 1240px; margin: 32px auto 80px; padding: 0 24px; display: none; }
  .map-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 16px;
    margin-bottom: 18px;
  }
  .map-title { font-size: 25px; font-weight: 750; }
  .map-sub { font-size: 13px; color: var(--muted); margin-top: 5px; max-width: 760px; line-height: 1.45; }
  .data-asof {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 7px;
    padding: 7px 10px;
    line-height: 1.45;
  }
  .map-controls {
    display: flex;
    gap: 8px;
    align-items: center;
    justify-content: flex-end;
    margin: 0 0 14px;
  }
  .map-select {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 7px;
    padding: 8px 10px;
    font-size: 13px;
  }
  .map-action-btn {
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #fff;
    border-radius: 7px;
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .map-action-btn:disabled { opacity: .55; cursor: not-allowed; }
  .map-status {
    font-size: 12px;
    color: var(--muted);
    min-height: 18px;
  }
  .map-chart-wrap { height: 470px; position: relative; }
  .map-empty {
    border: 1px dashed var(--border);
    background: var(--surface);
    border-radius: 10px;
    padding: 28px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 18px;
  }
  .map-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .valuation-dot { width: 9px; height: 9px; display: inline-block; border-radius: 50%; margin-right: 4px; }
  .valuation-pill {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    border-radius: 999px;
    padding: 3px 7px;
    white-space: nowrap;
  }
  .valuation-undervalued { background: #d7f3e5; color: #07543f; }
  .valuation-moderately-undervalued { background: #e7f7ed; color: #216546; }
  .valuation-about-right { background: #eef2ff; color: #3730a3; }
  .valuation-moderately-expensive { background: #fff2d7; color: #8a4d05; }
  .valuation-expensive { background: #fde6e6; color: #9f1d1d; }
  .valuation-insufficient { background: #f1f0ec; color: #77746d; }
  table.value-map {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  table.value-map th {
    padding: 7px 8px;
    text-align: right;
    border-bottom: 2px solid var(--border);
    font-size: 10.5px;
    color: var(--muted);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .04em;
    white-space: nowrap;
  }
  table.value-map th:first-child, table.value-map th:nth-child(2) { text-align: left; }
  table.value-map td {
    padding: 8px;
    border-bottom: 1px solid var(--border);
    text-align: right;
    vertical-align: middle;
    white-space: nowrap;
  }
  table.value-map td:first-child, table.value-map td:nth-child(2) { text-align: left; }
  table.value-map tr.clickable { cursor: pointer; }
  table.value-map tr.clickable:hover td { background: var(--bg); }
  .ticker-cell { font-weight: 800; color: var(--accent); }
  .name-cell { max-width: 230px; overflow: hidden; text-overflow: ellipsis; }

  /* ── PDF EXPORT ── */
  .pdf-btn {
    margin-left: auto;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    background: var(--surface);
    border: 1.5px solid var(--accent);
    border-radius: 7px;
    cursor: pointer;
    transition: all .15s;
    white-space: nowrap;
  }
  .pdf-btn:hover { background: var(--accent); color: #fff; }

  .print-header,
  .print-footer,
  .print-first-page-disclosures { display: none; }

  @media print {
    @page { size: letter; margin: 11mm 11mm 14mm; }
    body { background: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .site-header, .search-wrap, .state, .period-tabs, .no-print { display: none !important; }
    #results { max-width: 100%; margin: 0; padding: 0; }
    .print-page-one {
      height: 232mm;
      display: flex;
      flex-direction: column;
      position: relative;
      padding-bottom: 30mm;
      page-break-after: always;
      break-after: page;
      overflow: hidden;
    }
    .print-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 2px solid #0b0b0b;
      padding-bottom: 6px;
      margin-bottom: 14px;
      font-size: 11px;
      color: #555;
    }
    .print-header .print-logo { font-size: 16px; font-weight: 700; color: #0b0b0b; }
    .print-header .print-logo span { color: var(--accent); }
    .print-footer {
      display: block;
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding-top: 4px;
      border-top: 1px solid #ddd;
      font-size: 9px;
      color: #666;
      text-align: right;
    }
    .print-first-page-disclosures {
      display: block;
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      margin-top: 0;
      padding-top: 6px;
      border-top: 1px solid #d8d8d8;
      font-size: 7px;
      line-height: 1.15;
      color: #222;
      page-break-inside: avoid;
      break-inside: avoid;
    }
    .print-first-page-disclosures p { margin: 0 0 2px; }
    .print-first-page-disclosures strong { font-weight: 700; }
    .section, .chart-panel, .stat-card { box-shadow: none; page-break-inside: avoid; break-inside: avoid; }
    .charts-grid { page-break-inside: avoid; break-inside: avoid; }
    .stress-section { page-break-before: always; break-before: page; }
    .fund-name { font-size: 18px; }
    .fund-meta { margin-bottom: 14px; }
    .stat-value { font-size: 20px; }
    .stats { gap: 8px; margin-bottom: 14px; }
    .section { padding: 12px 16px; margin-bottom: 12px; }
    .score-layout { grid-template-columns: 210px 1fr; gap: 10px; }
    .score-hero { padding: 12px; }
    .score-number { font-size: 42px; }
    .score-category { font-size: 14px; }
    .score-summary { font-size: 11px; line-height: 1.35; margin-bottom: 8px; }
    .score-drivers { gap: 8px; }
    .driver-box { padding: 7px 9px; }
    .driver-box ul { font-size: 10px; line-height: 1.35; }
    .component-table { font-size: 10px; }
    .component-table th, .component-table td { padding: 3px 5px; }
    .print-page-one .score-method { display: none; }
    .print-page-one .section { margin-bottom: 8px; padding: 10px 14px; }
    .print-page-one canvas { max-height: 85px !important; }
    .chart-panel { padding: 12px 16px; }
    .charts-grid { gap: 12px; margin-bottom: 12px; }

<div id="valueMapPage"></div>

<script>
const LOCAL_API_ORIGIN = 'http://127.0.0.1:8000';
const API_ORIGIN = window.location.protocol === 'file:' ? LOCAL_API_ORIGIN : '';
const API = `${API_ORIGIN}/api/analyze`;
const VALUE_MAP_API = `${API_ORIGIN}/api/bdc-value-map`;
let activePage = 'analyze';
let analyzeRequestSeq = 0;

function isLocalStaticHost() {
  return ['127.0.0.1', 'localhost', '0.0.0.0'].includes(window.location.hostname)
    && window.location.port !== '8000';
}

function localApiUrlFor(url) {
  const parsed = new URL(url, window.location.href);
  if (!parsed.pathname.startsWith('/api/')) return null;
  return `${LOCAL_API_ORIGIN}${parsed.pathname}${parsed.search}`;
}

function apiRouteMissingMessage(pathname) {
  return `CreditPulse API route ${pathname} returned HTML instead of JSON. `
    + `Run the app with Vercel dev, or start the local FastAPI API at ${LOCAL_API_ORIGIN}.`;
}

async function fetchJson(url, options = {}, allowLocalFallback = true) {
  const res = await fetch(url, options);
  const contentType = (res.headers.get('content-type') || '').toLowerCase();
  const body = await res.text();
  const parsedUrl = new URL(url, window.location.href);

  if (!contentType.includes('application/json')) {
    const localUrl = allowLocalFallback && API_ORIGIN === '' && isLocalStaticHost()
      ? localApiUrlFor(url)
      : null;
    if (localUrl && localUrl !== parsedUrl.href) {
      return fetchJson(localUrl, options, false);
    }
    if (!res.ok) {
      const message = body.trim() || `HTTP ${res.status}`;
      throw new Error(res.status === 504
        ? 'The analysis timed out while parsing SEC filings. Please try again; if it repeats, this ticker needs a parser optimization.'
        : message);
    }
    if (body.trim().startsWith('<')) {
      throw new Error(apiRouteMissingMessage(parsedUrl.pathname));
    }
    throw new Error(`CreditPulse API returned ${contentType || 'an unknown response type'} instead of JSON.`);
  }

  let data;
  try {
    data = body ? JSON.parse(body) : null;
  } catch (err) {
    throw new Error(`CreditPulse API returned invalid JSON for ${parsedUrl.pathname}.`);
  }

  if (!res.ok) {
    throw new Error((data && data.detail) || `HTTP ${res.status}`);
  }

  return data;
}

// ── MARK COLOR ──────────────────────────────────────────────────────────────
function markColor(v) {
  if (v === null || v === undefined) return ['#f5f4f0', '#aaa'];
  if (v >= 100) return ['#d1f0df', '#085041'];
  if (v >= 90)  return ['#d1f0df', '#085041'];
  if (v >= 80)  return ['#faeeda', '#633806'];
  if (v >= 70)  return ['#fac775', '#412402'];
  if (v >= 60)  return ['#f09595', '#501313'];
  return           ['#e24b4a', '#ffffff'];
}

function markChip(v) {
  if (v === null || v === undefined) return '<span style="color:#ccc">—</span>';
  const [bg, fg] = markColor(v);
  return `<span class="mark-chip" style="background:${bg};color:${fg}">${v.toFixed(0)}</span>`;
}

function setActiveNav(page) {
  document.getElementById('navAnalyze').classList.toggle('active', page === 'analyze');
  document.getElementById('navValueMap').classList.toggle('active', page === 'value-map');
}

function isValueMapRoute() {
  return location.pathname.replace(/\/+$/, '') === '/bdc-value-map';
}

function showAnalyzePage() {
  activePage = 'analyze';
  setActiveNav('analyze');
  document.getElementById('searchWrap').style.display = 'block';
  document.getElementById('valueMapPage').style.display = 'none';
  const results = document.getElementById('results');
  results.style.display = results.innerHTML.trim() ? 'block' : 'none';
}

function showValueMapPage() {
  activePage = 'value-map';
  analyzeRequestSeq += 1;
  setActiveNav('value-map');
  document.getElementById('searchWrap').style.display = 'none';
  const results = document.getElementById('results');
  results.innerHTML = '';
  results.style.display = 'none';
  document.getElementById('valueMapPage').style.display = 'block';
  setLoading(false);
  clearError();
  renderValueMapPage();
}

function safePushState(path) {
  try {
    history.pushState({}, '', path);
  } catch (err) {
    console.warn('Unable to update browser history for navigation:', err);
  }
}

function safeReplaceState(path) {
  try {
    history.replaceState({}, '', path);
  } catch (err) {
    console.warn('Unable to update browser history for navigation:', err);
  }
}

document.getElementById('navAnalyze').addEventListener('click', e => {
  e.preventDefault();
  safePushState('/');
  showAnalyzePage();
});

document.getElementById('navValueMap').addEventListener('click', e => {
  e.preventDefault();
  safePushState('/bdc-value-map');
  showValueMapPage();
});

window.addEventListener('popstate', routeFromLocation);
window.addEventListener('pageshow', syncRouteState);
window.addEventListener('focus', syncRouteState);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) syncRouteState();
});

// ── SEARCH ──────────────────────────────────────────────────────────────────
function runTicker(t) {
  showAnalyzePage();
  if (location.pathname !== '/') safePushState(`/?ticker=${encodeURIComponent(t)}`);
  document.getElementById('tickerInput').value = t;
  doAnalyze();
}

document.getElementById('tickerInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') doAnalyze();
});

async function doAnalyze(forceRefresh = false) {
  const ticker = document.getElementById('tickerInput').value.trim().toUpperCase();
  if (!ticker) return;

  const requestId = ++analyzeRequestSeq;
  showAnalyzePage();
  setLoading(true, 'Fetching SEC filings…');
  clearError();
  if (!forceRefresh && location.pathname === '/') {
    safeReplaceState(`/?ticker=${encodeURIComponent(ticker)}`);
  }
  document.getElementById('results').style.display = 'none';

  try {
    const url = `${API}?ticker=${encodeURIComponent(ticker)}${forceRefresh ? '&refresh=true' : ''}`;
    const data = await fetchJson(url);

    if (requestId !== analyzeRequestSeq || activePage !== 'analyze') return;
    setLoading(false);
    renderResults(data);
  } catch (err) {
    if (requestId !== analyzeRequestSeq || activePage !== 'analyze') return;
    setLoading(false);
    showError(err.message || 'Unknown error');
  }
}

function setLoading(on, msg = '') {
  document.getElementById('loadingState').style.display = on ? 'block' : 'none';
  document.getElementById('loadingMsg').textContent = msg;
  document.getElementById('searchBtn').disabled = on;
}

function clearError() {
  document.getElementById('errorState').style.display = 'none';
}

function showError(msg) {
  document.getElementById('errorState').style.display = 'block';
  document.getElementById('errorMsg').textContent = msg;
}

// ── PDF EXPORT ───────────────────────────────────────────────────────────────
// Swaps chart canvases for static images (canvases misrender in print), opens
// the print dialog (destination "Save as PDF"), then restores the live charts.
function nextPaint() {
  return new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
}

function formatPrintTimestamp(d = new Date()) {
  return d.toLocaleString('en-US', {
    year: 'numeric',
    month: 'long',
    day: 'numeric',
    hour: 'numeric',
    minute: '2-digit',
    timeZoneName: 'short',
  });
}

function formatValueMapTimestamp(value) {
  if (!value) return 'not available';
  if (typeof value === 'string' && /^[A-Z][a-z]{2} \d{1,2}, \d{4}$/.test(value.trim())) {
    return value;
  }
  const d = new Date(value);
  return Number.isNaN(d.getTime()) ? String(value) : formatPrintTimestamp(d);
}

async function downloadPDF() {
  [scoreChartInst, positionScatterChartInst, maturityChartInst, stressChartInst, nearparChartInst, realizedLossChartInst, cumRealizedChartInst, leverageChartInst]
    .filter(Boolean)
    .forEach(chart => chart.update('none'));
  await nextPaint();

  const swaps = [];
  const decodes = [];
  document.querySelectorAll('#results canvas').forEach(cv => {
    const img = document.createElement('img');
    img.src = cv.toDataURL('image/png');
    img.className = `print-chart-img print-${cv.id || 'chart'}`;
    img.style.width = '100%';
    img.style.display = 'block';
    img.style.height = 'auto';
    if (img.decode) {
      decodes.push(img.decode().catch(() => {}));
    } else {
      decodes.push(new Promise(resolve => {
        img.onload = resolve;
        img.onerror = resolve;
      }));
    }
    swaps.push([cv, img]);
  });
  await Promise.all(decodes);

  const oldTitle = document.title;
  document.title = '';
  const printedAt = document.getElementById('printGeneratedAt');
  if (printedAt) printedAt.textContent = formatPrintTimestamp();
  swaps.forEach(([cv, img]) => {
    cv.parentNode.replaceChild(img, cv);
  });
  await nextPaint();

  const restore = () => {
    swaps.forEach(([cv, img]) => {
      if (img.parentNode) img.parentNode.replaceChild(cv, img);
    });
    document.title = oldTitle;
    window.onafterprint = null;
  };
  window.onafterprint = restore;

  window.print();
  // Fallback for browsers where print() returns before the dialog closes
  setTimeout(restore, 2000);
}

// ── RENDER ──────────────────────────────────────────────────────────────────
let scoreChartInst = null, positionScatterChartInst = null, maturityChartInst = null, stressChartInst = null, nearparChartInst = null, realizedLossChartInst = null, cumRealizedChartInst = null, leverageChartInst = null, valueMapChartInst = null;

async function renderValueMapPage(peerGroup = '') {
  const page = document.getElementById('valueMapPage');
  page.innerHTML = `<div class="state" style="display:block;margin-top:40px"><div class="spinner"></div><p class="state-msg">Loading BDC Value Map snapshots...</p></div>`;
  setLoading(false);

  try {
    const url = peerGroup ? `${VALUE_MAP_API}?peer_group=${encodeURIComponent(peerGroup)}` : VALUE_MAP_API;
    const data = await fetchJson(url);
    renderValueMapData(data, peerGroup);
  } catch (err) {
    const msg = err.message || 'Unable to load BDC Value Map.';
    page.innerHTML = `<div class="map-empty">${msg}</div>`;
  }
}

function renderValueMapData(data, selectedPeer = '') {
  const page = document.getElementById('valueMapPage');
  const s = data.summary || {};
  const rows = Array.isArray(data.rows) ? data.rows : [];
  window._valueMapRows = rows;
  window._valueMapPeer = selectedPeer || '';
  const refreshEnabled = !!(data.capabilities && data.capabilities.refreshEnabled);
  const plotted = rows.filter(r => r.hasSnapshot && isFiniteNumber(r.currentCreditPulseScore) && isFiniteNumber(r.actualPriceToNav));
  const peerOptions = [`<option value="">All peer groups</option>`]
    .concat((data.peerGroups || []).map(g => `<option value="${g}"${g === selectedPeer ? ' selected' : ''}>${g}</option>`))
    .join('');
  const summaryCards = [
    ['Median CreditPulse Score', fmtNum(s.medianCreditPulseScore, 1), `${s.snapshotCount || 0} snapshots`],
    ['Median P/NAV', fmtMultiple(s.medianPriceToNav), 'actual market P/NAV'],
    ['Median discount/premium', fmtPctDecimal(s.medianDiscountPremium), 'to latest reported NAV'],
    ['Potentially undervalued', s.potentiallyUndervalued ?? 0, 'relative to current peers'],
    ['Potentially expensive', s.potentiallyExpensive ?? 0, 'relative to current peers'],
    ['Declining scores', s.decliningCreditPulseScores ?? 0, 'vs prior quarter'],
    ['Current-quarter data', `${s.currentQuarterDataPct ?? 0}%`, 'coverage threshold met'],
  ].map(([label, value, sub]) => `
    <div class="stat-card">
      <div class="stat-label">${label}</div>
      <div class="stat-value">${value}</div>
      <div class="stat-sub">${sub}</div>
    </div>`).join('');

  page.innerHTML = `
    <div class="map-head">
      <div>
        <h1 class="map-title">BDC Value Map</h1>
        <p class="map-sub">Compares the active public BDC universe using the existing CreditPulse Score, market valuation snapshots, and a transparent peer-implied P/NAV model. The CreditPulse Score remains a pure credit-quality score.</p>
      </div>
      <div class="data-asof">
        <div>Prices as of ${formatValueMapTimestamp(data.marketDataAsOf || data.asOf)}</div>
        <div>Credit metrics as of ${formatValueMapTimestamp(data.creditMetricsAsOf || data.asOf)}</div>
      </div>
    </div>
    <div class="map-controls">
      <select class="map-select" id="peerGroupFilter" onchange="renderValueMapPage(this.value)">${peerOptions}</select>
      ${refreshEnabled ? '<button class="map-action-btn" id="refreshMapBtn" onclick="refreshVisibleValueMapSnapshots()">Refresh visible BDCs</button>' : ''}
      <span class="map-status" id="valueMapRefreshStatus"></span>
    </div>
    <div class="stats">${summaryCards}</div>
    ${data.message ? `<div class="map-empty">${data.message}</div>` : ''}

async function refreshVisibleValueMapSnapshots() {
  const btn = document.getElementById('refreshMapBtn');
  const status = document.getElementById('valueMapRefreshStatus');
  const rows = Array.isArray(window._valueMapRows) ? window._valueMapRows : [];
  const candidates = rows
    .filter(r => r && r.ticker)
    .sort((a, b) => Number(rowNeedsMarketRefresh(b)) - Number(rowNeedsMarketRefresh(a)))
    .slice(0, 3);

  if (!candidates.length) {
    if (status) status.textContent = 'No BDCs available to refresh.';
    return;
  }

  const tickers = candidates.map(r => r.ticker).join(',');
  if (btn) btn.disabled = true;
  if (status) status.textContent = `Refreshing ${tickers}. This can take about a minute...`;

  try {
    const url = `${VALUE_MAP_API}/refresh?tickers=${encodeURIComponent(tickers)}&max_items=${candidates.length}`;
    const data = await fetchJson(url, { method: 'POST' });
    const ok = (data.refreshed || []).map(r => r.ticker).join(', ') || 'none';
    const failed = (data.failures || []).map(r => r.ticker).join(', ');
    if (status) status.textContent = failed ? `Refreshed ${ok}; failed ${failed}.` : `Refreshed ${ok}. Reloading...`;
    await renderValueMapPage(window._valueMapPeer || '');
  } catch (err) {
    if (status) status.textContent = err.message || 'Refresh failed.';
  } finally {
    if (btn) btn.disabled = false;
  }
}

function rowNeedsMarketRefresh(row) {
  return !row.hasSnapshot
    || !isFiniteNumber(row.stockPrice)
    || !isFiniteNumber(row.latestNavPerShare)
    || !isFiniteNumber(row.actualPriceToNav)
    || !isFiniteNumber(row.equityMarketCapitalization);
}

  return [

function renderValueMapChart(data) {
  if (valueMapChartInst) { valueMapChartInst.destroy(); valueMapChartInst = null; }
  const canvas = document.getElementById('valueMapChart');
  const rows = (data.rows || []).filter(r => r.hasSnapshot && isFiniteNumber(r.currentCreditPulseScore) && isFiniteNumber(r.actualPriceToNav));
  if (!canvas || !rows.length) return;
  const maxCap = Math.max(...rows.map(r => Number(r.equityMarketCapitalization || 0)), 1);
  const colorFor = cls => ({
    undervalued: '#0b7a55',
    'moderately-undervalued': '#51a36f',
    'about-right': '#4f6fd7',
    'moderately-expensive': '#d99021',
    expensive: '#c83b32',
    insufficient: '#a3a09a',
  })[cls || 'insufficient'] || '#a3a09a';
  const borderFor = r => (r.scoreChange || 0) > 1 ? '#087f5b' : (r.scoreChange || 0) < -1 ? '#c81e1e' : '#73706a';
  const points = rows.map(r => ({
    x: Number(r.currentCreditPulseScore),
    y: Number(r.actualPriceToNav),
    r: 5 + Math.sqrt((r.equityMarketCapitalization || 0) / maxCap) * 23,
    ticker: r.ticker,
    name: r.legalName,
    classification: r.classification,
    pnav: r.actualPriceToNav,
    implied: r.peerImpliedPriceToNav,
    gap: r.valuationGap,
    cap: r.equityMarketCapitalization,
    scoreChange: r.scoreChange,
    className: r.classificationClass,
  }));
  const quadrantPlugin = {
    id: 'valueMapQuadrants',
    beforeDraw(chart) {
      const { ctx, chartArea, scales } = chart;
      if (!chartArea) return;
      const midX = scales.x.getPixelForValue(70);
      const midY = scales.y.getPixelForValue(1);
      ctx.save();
      ctx.strokeStyle = 'rgba(80,80,80,0.22)';
      ctx.setLineDash([5, 5]);
      ctx.beginPath(); ctx.moveTo(midX, chartArea.top); ctx.lineTo(midX, chartArea.bottom); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(chartArea.left, midY); ctx.lineTo(chartArea.right, midY); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(11,11,11,0.45)';
      ctx.font = '600 11px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif';
      ctx.fillText('Potential opportunity', chartArea.right - 145, chartArea.bottom - 14);
      ctx.fillText('Cheap for a reason', chartArea.left + 12, chartArea.bottom - 14);
      ctx.fillText('Quality priced in', chartArea.right - 115, chartArea.top + 18);
      ctx.fillText('Valuation risk', chartArea.left + 12, chartArea.top + 18);
      ctx.restore();
    },
  };

  valueMapChartInst = new Chart(canvas, {
    type: 'bubble',
    data: {
      datasets: [
        {
          label: 'BDCs',
          data: points,
          backgroundColor: points.map(p => colorFor(p.className) + 'cc'),
          borderColor: points.map(p => borderFor(p)),
          borderWidth: 2,
        },
      ],
    },
    plugins: [quadrantPlugin],
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      onClick(evt, els) {
        const hit = els.find(el => el.datasetIndex === 0);
        if (hit) openTickerFromMap(points[hit.index].ticker);
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            title: ctx => `${ctx[0]?.raw?.ticker || ''} · ${ctx[0]?.raw?.name || ''}`,
            label: ctx => {
              const p = ctx.raw;
              return [
                `Score: ${p.x} (${formatScoreChange(p.scoreChange)})`,
                `P/NAV: ${fmtMultiple(p.pnav)}`,
                `Peer-implied P/NAV: ${fmtMultiple(p.implied)}`,
                `Gap: ${fmtMultiple(p.gap)}`,
                `Market cap: ${fmtCurrencyCompact(p.cap)}`,
                p.classification || 'Insufficient data',
              ];
            },
          },
        },
      },
      scales: {
        x: { min: 0, max: 100, title: { display: true, text: 'CreditPulse Score' }, grid: { color: '#eee' } },
        y: { title: { display: true, text: 'Price / NAV' }, grid: { color: '#eee' }, ticks: { callback: v => Number(v).toFixed(2) + 'x' } },
      },
    },
  });
}

function formatScoreChange(v) {
  if (v === null || v === undefined || Number.isNaN(Number(v))) return 'N/A';
  return `${v >= 0 ? '+' : ''}${v}`;
}

function componentLabel(k) {
  return ({
    delinquency: 'Mark Buckets',
    rollRates: 'Roll Rates',
    lossesAndRecoveries: 'Losses & Unrealized',

function renderLeverageChart(lev) {

  const req = lev.requirement || {};
  const labels = items.map(i => i.quarter);
  // Coverage = numerator / denominator. Numerator: total assets where the
  // filing tags them (NPORT), otherwise equity + debt (the 1940 Act
  // senior-securities approximation). Denominator: debt. Bars make the
  // redemption dynamic visible: equity outflows shrink the numerator while
  // debt holds or rises, compressing the coverage line.
  const numer = items.map(i => (i.assets ?? ((i.equity || 0) + (i.debt || 0))));
  const denom = items.map(i => i.debt);

  leverageChartInst = new Chart(canvas, {
    type: 'bar',
    data: {
      labels,

        {
          type: 'line',
          label: 'Asset coverage %',

          backgroundColor: 'rgba(26,86,219,0.08)',

          yAxisID: 'pct', order: 0,

        {
          type: 'bar',
          label: 'Assets (numerator)',
          data: numer,
          backgroundColor: 'rgba(26,86,219,0.30)',
          borderColor: 'rgba(26,86,219,0.55)', borderWidth: 1,
          yAxisID: 'usd', order: 2,

        {
          type: 'bar',
          label: 'Debt (denominator)',

          backgroundColor: 'rgba(180,35,24,0.30)',

  const bubbleRadius = fvM => {
    const n = Number(fvM || 0);
    if (!Number.isFinite(n) || n <= 0 || maxFvM <= 0) return 6;
    const relative = n / maxFvM;
    return 4 + Math.pow(relative, 2.2) * 34;
  };
  const bandColor = price => price < 70 ? '#ce3430'
    : price < 80 ? '#d46b2d'
    : price < 90 ? '#d9a321'
    : '#284f9e';

  const points = items.map(item => ({
    x: Number(item.fv_m || 0),
    y: Number(item.price || 0),
    r: bubbleRadius(item.fv_m),
    name: item.name || 'Unknown',
    type: item.type || 'Investment',
    currency: item.currency || 'USD',
    portfolioPct: item.portfolio_pct,
  }));

  const priceBandPlugin = {
    id: 'priceBandPlugin',
    beforeDraw(chart) {
      const { ctx, chartArea, scales } = chart;
      if (!chartArea || !scales.y) return;
      const bands = [
        { lo: scales.y.min, hi: 70, color: 'rgba(206,52,48,0.08)' },
        { lo: 70, hi: 80, color: 'rgba(212,107,45,0.08)' },
        { lo: 80, hi: 90, color: 'rgba(217,163,33,0.08)' },
        { lo: 90, hi: scales.y.max, color: 'rgba(40,79,158,0.05)' },
      ];
      ctx.save();
      bands.forEach(b => {
        const top = scales.y.getPixelForValue(Math.min(b.hi, scales.y.max));
        const bottom = scales.y.getPixelForValue(Math.max(b.lo, scales.y.min));
        ctx.fillStyle = b.color;
        ctx.fillRect(chartArea.left, top, chartArea.right - chartArea.left, bottom - top);
      });
      [70, 80, 90].forEach(v => {
        if (v < scales.y.min || v > scales.y.max) return;
        const y = scales.y.getPixelForValue(v);
        ctx.strokeStyle = v === 90 ? 'rgba(206,52,48,0.45)' : 'rgba(80,80,80,0.22)';
        ctx.lineWidth = v === 90 ? 1.4 : 1;
        ctx.setLineDash(v === 90 ? [4, 4] : [3, 4]);
        ctx.beginPath();
        ctx.moveTo(chartArea.left, y);
        ctx.lineTo(chartArea.right, y);
        ctx.stroke();
      });
      ctx.restore();
    },
  };

  positionScatterChartInst = new Chart(canvas, {
    type: 'bubble',
    data: {
      datasets: [{
        label: 'Position',
        data: points,
        backgroundColor: points.map(p => bandColor(p.y) + 'dd'),
        hoverBackgroundColor: points.map(p => bandColor(p.y)),
        pointBorderColor: '#fff',
        pointBorderWidth: 1,
      }],
    },
    plugins: [priceBandPlugin],
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            title: ctx => ctx[0]?.raw?.name || 'Position',
            label: ctx => {
              const p = ctx.raw;
              return [
                `FV: $${p.x.toFixed(1)}M`,
                `Price / mark: $${p.y.toFixed(2)}`,
                `Portfolio share: ${p.portfolioPct ?? 'N/A'}%`,
                `${p.type} · ${p.currency}`,
              ];
            },
          },
        },
      },
      scales: {
        x: {
          title: { display: true, text: 'Fair value ($M)', font: { size: 12 }},
          grid: { color: '#eee' },
          ticks: { font: { size: 11 }, callback: v => '$' + Number(v).toFixed(0) + 'M' },
        },
        y: {
          title: { display: true, text: 'Price / mark ($ per $100 par)', font: { size: 12 }},
          grid: { color: '#eee' },
          ticks: { font: { size: 11 }, callback: v => '$' + Number(v).toFixed(0) },
          suggestedMin: Math.max(0, Math.min(...points.map(p => p.y)) - 5),
          suggestedMax: Math.max(...points.map(p => p.y)) + 5,
        },
      },
    },
  });
}

// ── MATURITY PROFILE ─────────────────────────────────────────────────────────
// 'mv' = market-value weighted price (Σ price·value / Σ value);
// 'par' = par weighted (Σ value / Σ par). Resets to 'mv' on each analysis.
let maturityMode = 'mv';

function renderMaturitySection(mp) {

    </div>`;

    <div class="position-scatter-head">

function setMaturityMode(mode) {
  maturityMode = mode;
  const mv  = document.getElementById('matBtnMv');

  if (mv)  mv.classList.toggle('active', mode === 'mv');

}

function renderMaturityChart(mp) {
  if (maturityChartInst) { maturityChartInst.destroy(); maturityChartInst = null; }

function formatCompactDollar(v) {
  if (v === null || v === undefined || Number.isNaN(Number(v))) return 'N/A';
  const abs = Math.abs(Number(v));
  const sign = Number(v) < 0 ? '-' : '';
  if (abs >= 1e9) return `${sign}$${(abs / 1e9).toFixed(1)}B`;
  if (abs >= 1e6) return `${sign}$${(abs / 1e6).toFixed(1)}M`;
  if (abs >= 1e3) return `${sign}$${(abs / 1e3).toFixed(1)}K`;
  return `${sign}$${abs.toFixed(0)}`;
}

function isFiniteNumber(v) {
  return v !== null && v !== undefined && Number.isFinite(Number(v));
}

function fmtNum(v, digits = 1) {
  return isFiniteNumber(v) ? Number(v).toFixed(digits) : 'N/A';
}

function fmtCurrency(v) {
  return isFiniteNumber(v) ? '$' + Number(v).toFixed(2) : 'N/A';
}

function fmtCurrencyCompact(v) {
  return isFiniteNumber(v) ? formatCompactDollar(Number(v)) : 'N/A';
}

function fmtMultiple(v) {
  return isFiniteNumber(v) ? Number(v).toFixed(2) + 'x' : 'N/A';
}

function fmtPctDecimal(v) {
  return isFiniteNumber(v) ? (Number(v) * 100).toFixed(1) + '%' : 'N/A';
}

function realizedMetricLabel(type) {
  return type === 'gross_realized_loss' ? 'Gross realized losses'
    : type === 'net_realized_loss' ? 'Net realized losses'
    : 'Unavailable';
}

function renderRealizedLossSection(rl) {
  const rows = rl && Array.isArray(rl.items) ? rl.items : [];
  const hasData = rows.some(r => r.dataAvailable || r.unrealizedAvailable);
  const title = (rl && rl.title) || 'Realized & Unrealized Gains (Losses)';

  if (!hasData) {
    return `<div class="section realized-section">
      <div class="section-title">${title}</div>
      <p class="realized-insight">${rl && rl.insight ? rl.insight : 'Realized gain/loss data was not available in the parsed SEC filings for these quarters.'}</p>
      <p class="source-note">${rl && rl.definition ? rl.definition : ''}</p>
    </div>`;
  }

  const gs = rl.gains_summary || {};
  const signCls = v => (v === null || v === undefined) ? '' : (v < 0 ? 'danger' : 'ok');
  const tile = (label, value, sub, cls) => `
    <div class="stat-card">
      <div class="stat-label">${label}</div>
      <div class="stat-value ${cls || ''}">${value}</div>
      <div class="stat-sub">${sub || ''}</div>
    </div>`;
  const latestQ = gs.latest_quarter || 'Latest Q';

  const tiles = [
    tile(`Cumulative realized (${gs.quarters_covered || 0}Q)`,
         formatCompactDollar(gs.cum_realized), 'net realized gains (losses)', signCls(gs.cum_realized)),
    tile('As % of avg portfolio',
         (gs.cum_realized_pct !== null && gs.cum_realized_pct !== undefined) ? gs.cum_realized_pct + '%' : 'N/A',
         `avg portfolio ${formatCompactDollar(gs.avg_portfolio)}`, signCls(gs.cum_realized_pct)),
    tile(`${latestQ} realized`, formatCompactDollar(gs.latest_realized),
         'net realized', signCls(gs.latest_realized)),
    tile(`${latestQ} unrealized`, formatCompactDollar(gs.latest_unrealized),

  ].join('');

  const tableRows = rows.map(r => `
    <tr>
      <td>${r.quarter || 'N/A'}</td>
      <td>${r.dataAvailable ? formatCompactDollar(r.originalValue) : 'N/A'}</td>
      <td>${r.unrealizedAvailable ? formatCompactDollar(r.unrealizedChange) : 'N/A'}</td>
      <td>${r.source || 'N/A'}${r.periodEnd ? ' · ' + r.periodEnd : ''}</td>
    </tr>
  `).join('');

  return `<div class="section realized-section">
    <div class="section-title">${title}</div>
    <div class="gains-tiles">${tiles}</div>
    <div class="realized-loss-chart-wrap">
      <canvas id="realizedLossChart"></canvas>
    </div>
    <div class="chart-title" style="margin:16px 0 6px">Cumulative realized gains (losses)</div>

    <table class="realized">

      <tbody>${tableRows}</tbody>
    </table>
    <p class="source-note">${rl.definition || ''}</p>
  </div>`;
}

// ── BUCKET CHARTS ────────────────────────────────────────────────────────────
const CHART_COLORS = [
  'rgba(180,210,240,0.85)',
  'rgba(130,175,215,0.85)',
  'rgba(80,140,190,0.85)',
  'rgba(40,100,160,0.85)',
  'rgba(15,60,120,0.85)',
  'rgba(200,155,40,0.92)',
];

// '$' = raw $M fair value; '%' = each bucket as a share of that quarter's
// total portfolio FV. Resets to '%' on every new analysis.
let bucketMode = '%';

function setBucketMode(mode) {
  bucketMode = mode;
  const btnD = document.getElementById('modeBtnDollar');
  const btnP = document.getElementById('modeBtnPct');
  if (btnD) btnD.classList.toggle('active', mode === '$');
  if (btnP) btnP.classList.toggle('active', mode === '%');

  const suffix = mode === '%' ? '(% of portfolio)' : '($M fair value)';
  const st = document.getElementById('stressChartTitle');
  const nt = document.getElementById('nearparChartTitle');
  if (st) st.textContent = `Stress zone · mark 0–90 ${suffix}`;
  if (nt) nt.textContent = `Near par · mark 90–100+ ${suffix}`;

  if (window._bucketData) {
    renderBucketCharts(window._bucketData.b, window._bucketData.qtrs);
  }
}

function renderBucketCharts(b, qtrs) {
  window._bucketData = { b, qtrs };
  const stressBuckets  = ['< 50', '50–60', '60–70', '70–80', '80–90'];
  const nearparBuckets = ['90–100', '100+'];

  // destroy old
  if (stressChartInst)  { stressChartInst.destroy(); }
  if (nearparChartInst) { nearparChartInst.destroy(); }

  // Per-quarter total FV across ALL buckets (incl. "< 50") — the denominator
  // for percentage mode
  const allBuckets = b.names || Object.keys(b.data);
  const qtrTotals = qtrs.map((q, qi) =>
    allBuckets.reduce((s, n) => s + ((b.data[n] || [])[qi] || 0), 0));

  const pctMode = bucketMode === '%';
  const fmtTick = v => pctMode ? v + '%' : '$' + v + 'M';
  const fmtTip  = v => pctMode ? v.toFixed(1) + '%' : '$' + v.toFixed(0) + 'M';

  const opts = {
    responsive: true,
    maintainAspectRatio: false,
    animation: false,
    plugins: {
      legend: {
        position: 'bottom',
        labels: { font: { size: 9 }, boxWidth: 8, boxHeight: 8, padding: 6 },
      },
      tooltip: { callbacks: { label: ctx => ` ${ctx.dataset.label}: ${fmtTip(ctx.parsed.y)}` }},
    },
    scales: {
      x: { grid: { display: false }, ticks: { font: { size: 11 }}},
      y: { grid: { color: '#eee' }, ticks: { font: { size: 11 }, callback: fmtTick }},
    },
  };

  function buildDatasets(buckets) {
    return qtrs.map((q, qi) => ({
      label: q,
      backgroundColor: CHART_COLORS[qi % CHART_COLORS.length],
      data: buckets.map(bname => {
        const raw = b.data[bname] ? (b.data[bname][qi] || 0) : 0;
        if (!pctMode) return raw;
        return qtrTotals[qi] > 0 ? raw / qtrTotals[qi] * 100 : 0;
      }),
    }));
  }

  stressChartInst = new Chart(document.getElementById('stressChart'), {
    type: 'bar',
    data: { labels: stressBuckets, datasets: buildDatasets(stressBuckets) },
    options: opts,
  });

  nearparChartInst = new Chart(document.getElementById('nearparChart'), {
    type: 'bar',
    data: { labels: nearparBuckets, datasets: buildDatasets(nearparBuckets) },
    options: opts,
  });
}

// ── ROLL-RATE ────────────────────────────────────────────────────────────────
function renderRollRate(rr) {
  const tabs = document.getElementById('periodTabs');
  const wrap = document.getElementById('matrixWrap');
  const bar  = document.getElementById('rateBar');
  const N    = rr.bucket_names.length;

  tabs.innerHTML = rr.period_labels.map((label, i) =>
    `<div class="period-tab${i===rr.period_labels.length-1?' active':''}" onclick="showMatrix(${i})" id="ptab_${i}">${label}</div>`
  ).join('');

  window._rrData = rr;

  showMatrix(rr.period_labels.length - 1);
}

function showMatrix(idx) {
  const rr   = window._rrData;
  const N    = rr.bucket_names.length;
  const pm   = rr.period_matrices[idx];
  const mat  = pm.matrix;
  const ar   = rr.avg_rates;

  // Update tab highlights
  document.querySelectorAll('.period-tab').forEach((el, i) => {
    el.classList.toggle('active', i === idx);
  });

  // Header row
  const colHeaders = [...rr.bucket_names, 'Exit'];
  const rowHeaders = [...rr.bucket_names, 'Entry'];

  let html = '<table class="matrix">';
  html += '<thead><tr><th style="text-align:left">From \\ To</th>';
  colHeaders.forEach((h, ci) => {
    const cls = ci === N ? 'exit-col' : '';
    html += `<th class="${cls}">${h}</th>`;
  });
  html += '</tr></thead><tbody>';

  mat.forEach((row, ri) => {
    const rowIsEntry = ri === N;
    html += `<tr>`;
    html += `<td class="row-label ${rowIsEntry ? 'entry-row' : ''}">${rowHeaders[ri]}</td>`;
    row.forEach((val, ci) => {
      const colIsExit  = ci === N;
      const isDiag     = ri === ci && !rowIsEntry && !colIsExit;
      const isWorsen   = !rowIsEntry && !colIsExit && ci < ri;
      const isImprove  = !rowIsEntry && !colIsExit && ci > ri;
      const isEntry    = rowIsEntry;
      const isExit     = colIsExit && !rowIsEntry;
      const isZero     = val === 0;

      let cls = '';
      if (isDiag)   cls = 'diagonal';
      else if (isWorsen)  cls = 'worsen';
      else if (isImprove) cls = 'improve';
      else if (isExit)    cls = 'exit-col';
      else if (isEntry)   cls = 'entry-row';
      if (isZero) cls += ' zero';

      html += `<td class="${cls}">${val === 0 ? '—' : '$'+val.toFixed(1)+'M'}</td>`;
    });
    html += '</tr>';
  });
  html += '</tbody></table>';

  document.getElementById('matrixWrap').innerHTML = html;

  // Rate summary bar
  const fwd  = ar.forward_roll[idx];
  const cure = ar.cure[idx];
  const stay = ar.stay[idx];
  const exit = ar.exit[idx];
  const deterioration = cure > 0 ? `${(fwd / cure).toFixed(1)}x` : 'N/A';

  document.getElementById('rateBar').innerHTML = `
    <div class="rate-item">
      <div class="rate-label">Forward Roll Rate</div>
      <div class="rate-val danger">${fwd}%</div>
      <div style="font-size:11px;color:var(--muted)">moved to worse bucket</div>
    </div>
    <div class="rate-item">
      <div class="rate-label">Cure Rate</div>
      <div class="rate-val ok">${cure}%</div>
      <div style="font-size:11px;color:var(--muted)">moved to better bucket</div>
    </div>
    <div class="rate-item">
      <div class="rate-label">Deterioration Ratio</div>
      <div class="rate-val danger">${deterioration}</div>
      <div style="font-size:11px;color:var(--muted)">forward roll / cure</div>
    </div>
    <div class="rate-item">
      <div class="rate-label">Stay Rate</div>
      <div class="rate-val muted">${stay}%</div>
      <div style="font-size:11px;color:var(--muted)">remained in same bucket</div>
    </div>
    <div class="rate-item">
      <div class="rate-label">Exit Rate</div>
      <div class="rate-val muted">${exit}%</div>
      <div style="font-size:11px;color:var(--muted)">left portfolio</div>
    </div>
  `;
}

// ── STRESS TABLE ─────────────────────────────────────────────────────────────
function renderStressTable(sp, qtrs) {
  const sectionLabel = {
    migrated: 'Newly Migrated',
    stressed: 'Already Stressed',
    new:      'New Position',
  };

  let html = `<div class="section stress-section">
  <div class="section-title">Stressed Positions — Mark History</div>
  <p style="font-size:12px;color:var(--muted);margin-bottom:14px;">
    FV-weighted average mark per borrower · mark &lt; 90 in latest quarter · minimum $100K FV
  </p>
  <div style="overflow-x:auto">
  <table class="stress">
    <thead>
      <tr>
        <th style="text-align:left;min-width:220px">Company</th>
        ${qtrs.map(q => `<th>${q}</th>`).join('')}
        <th>Latest FV</th>
        <th>Chg</th>
      </tr>
    </thead>
    <tbody>`;

  let lastSection = null;

  sp.forEach(c => {
    if (c.section !== lastSection) {
      html += `<tr class="section-row"><td colspan="${qtrs.length + 3}" style="padding:10px 10px 4px;border-bottom:1px solid var(--border)">
        <span class="section-badge ${c.section}">${sectionLabel[c.section] || c.section}</span>
      </td></tr>`;
      lastSection = c.section;
    }

    const fvStr = c.latest_fv_k >= 1000
      ? `$${(c.latest_fv_k/1000).toFixed(1)}M`
      : `$${c.latest_fv_k}K`;

    const chgColor = c.chg > 0 ? 'color:var(--ok)' : c.chg < -20 ? 'color:var(--danger);font-weight:700' : 'color:var(--warn)';

    const markCells = qtrs.map(q => {
      const v = c.marks[q];
      return `<td>${markChip(v)}</td>`;
    }).join('');

    html += `<tr>
      <td title="${c.name}">${c.name.length > 40 ? c.name.slice(0,39)+'…' : c.name}</td>
      ${markCells}
      <td>${fvStr}</td>
      <td style="${chgColor}">${c.chg > 0 ? '+' : ''}${c.chg.toFixed(1)}</td>
    </tr>`;
  });

  html += `</tbody></table></div></div>`;
  return html;
}

function routeFromLocation() {
  if (isValueMapRoute()) {
    showValueMapPage();
    return;
  }
  showAnalyzePage();
  const params = new URLSearchParams(location.search);
  const ticker = params.get('ticker');
  if (ticker) {
    document.getElementById('tickerInput').value = ticker.toUpperCase();
    doAnalyze();
  }
}

function syncRouteState() {
  if (!isValueMapRoute()) return;
  const results = document.getElementById('results');
  const valueMapPage = document.getElementById('valueMapPage');
  const mapIsHidden = valueMapPage && getComputedStyle(valueMapPage).display === 'none';
  const staleAnalysisVisible = results && (
    getComputedStyle(results).display !== 'none' ||
    results.innerHTML.trim().length > 0
  );
  if (activePage !== 'value-map' || mapIsHidden || staleAnalysisVisible) {
    showValueMapPage();
  }
}

routeFromLocation();
</script>
</body>
</html>
